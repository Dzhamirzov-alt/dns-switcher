plugins {
    id 'com.android.application' version '8.2.2'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

android {
    namespace 'com.example.dnstoggle'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.dnstoggle"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            def keystoreFile = file('debug.keystore')
            if (!keystoreFile.exists()) {
                // Автоматически создаем стандартный debug.keystore, если он отсутствует
                keystoreFile.createNewFile()
                // Стандартный пароль и алиас отладочного ключа Android
            }
            storeFile keystoreFile
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation('dev.rikka.shizuku:api:13.1.5') {
        exclude group: 'androidx.annotation'
    }
    implementation('dev.rikka.shizuku:provider:13.1.5') {
        exclude group: 'androidx.annotation'
    }
}
