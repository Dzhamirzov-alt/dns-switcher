name: Build Android APK & Windows Installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Custom Icon and Zapret DPI
        working-directory: ./windows
        shell: pwsh
        run: |
          if (Test-Path "1000258844.ico") { Copy-Item "1000258844.ico" "icon.ico" -Force; }
          elseif (Test-Path "../1000258844.ico") { Copy-Item "../1000258844.ico" "icon.ico" -Force; }
          elseif (Test-Path "../icon.ico") { Copy-Item "../icon.ico" "icon.ico" -Force; }
          if (-not (Test-Path "icon.ico")) { Write-Error "icon.ico not found!"; exit 1; }

          # Скачиваем официальный архив zapret-winws
          Write-Host "Скачивание движка Zapret (winws)..."
          $zapretUrl = "https://github.com/bol-van/zapret-winws/releases/latest/download/zapret-winws.zip"
          $zipPath = "$PWD\zapret.zip"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $zapretUrl -OutFile $zipPath

          # Создаем папку dpi и распаковываем нужные файлы
          $dpiDir = "$PWD\publish\dpi"
          if (-not (Test-Path $dpiDir)) { New-Item -ItemType Directory -Path $dpiDir | Out-Null }
          
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zipPath, "$PWD\zapret_extracted")

          # Копируем winws.exe и WinDivert извлеченные файлы в папку publish\dpi
          $binFolder = Get-ChildItem -Path "$PWD\zapret_extracted" -Recurse -Directory | Where-Object { $_.Name -match "bin|x86_64" } | Select-Object -First 1
          if ($binFolder) {
              Copy-Item "$($binFolder.FullName)\*" $dpiDir -Recurse -Force
          } else {
              Copy-Item "$PWD\zapret_extracted\*" $dpiDir -Recurse -Force
          }
          Remove-Item $zipPath -Force
          Remove-Item "$PWD\zapret_extracted" -Recurse -Force

      - name: Publish Standalone EXE
        working-directory: ./windows
        run: dotnet publish DnsSwitcherPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

      - name: Compile Windows Installer (Inno Setup)
        working-directory: ./windows
        run: iscc installer.iss

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Windows-Installer
          path: windows/installer_out/DNS_Switcher_Pro_Setup.exe
