name: Build Android APK & Windows Installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Поток 1: Сборка Android-версии (.apk)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  # Поток 2: Сборка Windows-установщика со встроенным Zapret Discord + YouTube
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Custom Icon
        working-directory: ./windows
        shell: pwsh
        run: |
          if (Test-Path "1000258844.ico") { Copy-Item "1000258844.ico" "icon.ico" -Force; }
          elseif (Test-Path "../1000258844.ico") { Copy-Item "../1000258844.ico" "icon.ico" -Force; }
          elseif (Test-Path "../icon.ico") { Copy-Item "../icon.ico" "icon.ico" -Force; }
          if (-not (Test-Path "icon.ico")) { Write-Error "icon.ico not found!"; exit 1; }

      - name: Publish Standalone EXE
        working-directory: ./windows
        run: dotnet publish DnsSwitcherPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

      - name: Download and Bundle Zapret Discord YouTube (bin + lists)
        working-directory: ./windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dpiDir = "$PWD\publish\dpi"
          $dpiListsDir = "$PWD\publish\dpi\lists"
          if (-not (Test-Path $dpiDir)) { New-Item -ItemType Directory -Path $dpiDir -Force | Out-Null }
          if (-not (Test-Path $dpiListsDir)) { New-Item -ItemType Directory -Path $dpiListsDir -Force | Out-Null }

          Write-Host "Клонирование актуальной сборки Flowseal/zapret-discord-youtube..."
          $bundleDir = "$PWD\zapret_dy"
          if (Test-Path $bundleDir) { Remove-Item $bundleDir -Recurse -Force }

          git clone --depth 1 https://github.com/Flowseal/zapret-discord-youtube.git $bundleDir

          if (-not (Test-Path "$bundleDir\bin\winws.exe")) {
              Write-Error "winws.exe не найден в Flowseal/zapret-discord-youtube!"
              exit 1
          }

          # Копируем все бинарники и фейк-пакеты (.bin, .dll, .sys, winws.exe) в publish\dpi
          Copy-Item "$bundleDir\bin\*" $dpiDir -Recurse -Force

          # Копируем все списки доменов (list-general.txt, list-google.txt, ipset-all.txt и др.) в publish\dpi\lists
          if (Test-Path "$bundleDir\lists") {
              Copy-Item "$bundleDir\lists\*" $dpiListsDir -Recurse -Force
          }

          Remove-Item $bundleDir -Recurse -Force

          Write-Host "Файлы в папке publish\dpi:"
          Get-ChildItem $dpiDir | Select-Object Name, Length

          # Гарантируем упаковку папки publish\dpi и вложенной папки lists в installer.iss
          $issPath = "$PWD\installer.iss"
          if (Test-Path $issPath) {
              $issContent = Get-Content $issPath -Raw
              if ($issContent -notmatch "publish\\dpi") {
                  Write-Host "Добавляем упаковку папки dpi в installer.iss..."
                  $dpiLine = "Source: ""publish\dpi\*""; DestDir: ""{app}\dpi""; Flags: ignoreversion recursesubdirs createallsubdirs"
                  $issContent = $issContent -replace "(\[Files\])", "`$1`r`n$dpiLine"
                  Set-Content -Path $issPath -Value$issContent -Encoding UTF8
              }
          }

      - name: Compile Windows Installer (Inno Setup)
        working-directory: ./windows
        run: iscc installer.iss

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Windows-Installer
          path: windows/installer_out/DNS_Switcher_Pro_Setup.exe
