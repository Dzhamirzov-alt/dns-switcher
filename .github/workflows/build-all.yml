name: Build Android APK & Windows Installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Поток 1: Сборка Android-версии (.apk)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  # Поток 2: Сборка Windows-установщика со встроенным Zapret DPI
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Custom Icon
        working-directory: ./windows
        shell: pwsh
        run: |
          if (Test-Path "1000258844.ico") { Copy-Item "1000258844.ico" "icon.ico" -Force; }
          elseif (Test-Path "../1000258844.ico") { Copy-Item "../1000258844.ico" "icon.ico" -Force; }
          elseif (Test-Path "../icon.ico") { Copy-Item "../icon.ico" "icon.ico" -Force; }
          if (-not (Test-Path "icon.ico")) { Write-Error "icon.ico not found!"; exit 1; }

      - name: Publish Standalone EXE
        working-directory: ./windows
        run: dotnet publish DnsSwitcherPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

      - name: Download and Bundle Zapret (winws + WinDivert + Cygwin)
        working-directory: ./windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dpiDir = "$PWD\publish\dpi"
          if (-not (Test-Path $dpiDir)) { New-Item -ItemType Directory -Path $dpiDir -Force | Out-Null }

          Write-Host "Скачивание официального пакета bol-van/zapret-win-bundle..."
          $bundleDir = "$PWD\zapret_bundle"
          if (Test-Path $bundleDir) { Remove-Item $bundleDir -Recurse -Force }

          # Способ 1: Быстрое клонирование последнего среза официального репозитория zapret-win-bundle
          git clone --depth 1 https://github.com/bol-van/zapret-win-bundle.git $bundleDir

          $winwsSource = Join-Path $bundleDir "zapret-winws"
          if (-not (Test-Path "$winwsSource\winws.exe")) {
              Write-Error "Не найден winws.exe в скачанном пакете zapret-win-bundle!"
              exit 1
          }

          # Копируем весь комплект (winws.exe, WinDivert64.sys, WinDivert.dll, cygwin1.dll, фейковые пакеты .bin)
          Copy-Item "$winwsSource\*" $dpiDir -Recurse -Force
          Remove-Item $bundleDir -Recurse -Force

          Write-Host "Файлы в папке publish\dpi:"
          Get-ChildItem $dpiDir | Select-Object Name, Length

          # Гарантируем, что Inno Setup упакует папку publish\dpi внутрь установщика
          $issPath = "$PWD\installer.iss"
          if (Test-Path $issPath) {
              $issContent = Get-Content $issPath -Raw
              if ($issContent -notmatch "publish\\dpi") {
                  Write-Host "Добавляем упаковку папки dpi в installer.iss..."
                  $dpiLine = "Source: ""publish\dpi\*""; DestDir: ""{app}\dpi""; Flags: ignoreversion recursesubdirs createallsubdirs"
                  $issContent = $issContent -replace "(\[Files\])", "`$1`r`n$dpiLine"
                  Set-Content -Path $issPath -Value $issContent -Encoding UTF8
              }
          }

      - name: Compile Windows Installer (Inno Setup)
        working-directory: ./windows
        run: iscc installer.iss

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Windows-Installer
          path: windows/installer_out/DNS_Switcher_Pro_Setup.exe
