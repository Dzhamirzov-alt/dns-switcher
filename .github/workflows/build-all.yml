name: Build Android APK & Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Поток 1: Сборка Android-версии (.apk)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  # Поток 2: Сборка Windows-версии (.exe) из папки windows/
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Standalone Single-File EXE
        working-directory: ./windows
        run: dotnet publish DnsSwitcherPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Windows-EXE
          path: windows/publish/DNS_Switcher_Pro.exe
