name: Build Android APK & Windows Installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Поток 1: Сборка Android-версии (.apk)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  # Поток 2: Сборка Windows-установщика со встроенным Zapret DPI
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Custom Icon
        working-directory: ./windows
        shell: pwsh
        run: |
          if (Test-Path "1000258844.ico") { [System.IO.File]::Copy("1000258844.ico", "icon.ico", $true); }
          elseif (Test-Path "../1000258844.ico") { [System.IO.File]::Copy("../1000258844.ico", "icon.ico", $true); }
          elseif (Test-Path "../icon.ico") { [System.IO.File]::Copy("../icon.ico", "icon.ico", $true); }
          if (-not (Test-Path "icon.ico")) { Write-Error "icon.ico not found!"; exit 1; }

      - name: Publish Standalone EXE
        working-directory: ./windows
        run: dotnet publish DnsSwitcherPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

      - name: Download and Bundle Zapret Discord YouTube (bin + lists)
        working-directory: ./windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop";
          $dpiDir = Join-Path $PWD "publish\dpi";
          $listsDir = Join-Path $dpiDir "lists";
          [System.IO.Directory]::CreateDirectory($dpiDir) | Out-Null;
          [System.IO.Directory]::CreateDirectory($listsDir) | Out-Null;

          Write-Host "Клонирование актуальной сборки Flowseal/zapret-discord-youtube...";
          $repoDir = Join-Path $PWD "zapret_dy";
          if (Test-Path $repoDir) { Remove-Item -Path $repoDir -Recurse -Force; }

          git clone --depth 1 https://github.com/Flowseal/zapret-discord-youtube.git $repoDir;

          $binSource = Join-Path $repoDir "bin";
          $listsSource = Join-Path $repoDir "lists";

          if (Test-Path $binSource) {
              Copy-Item -Path "$binSource\*" -Destination $dpiDir -Recurse -Force;
          }
          if (Test-Path $listsSource) {
              Copy-Item -Path "$listsSource\*" -Destination $listsDir -Recurse -Force;
              Copy-Item -Path "$listsSource\*" -Destination $dpiDir -Recurse -Force;
          }

          # Если в репозитории Flowseal бинарники лежат в другом месте, догружаем из bol-van/zapret-win-bundle
          if (-not (Test-Path (Join-Path $dpiDir "winws.exe"))) {
              Write-Host "Догрузка winws.exe из bol-van/zapret-win-bundle...";
              $bundleDir = Join-Path $PWD "zapret_bundle";
              git clone --depth 1 https://github.com/bol-van/zapret-win-bundle.git $bundleDir;
              $winwsSrc = Join-Path $bundleDir "zapret-winws";
              Copy-Item -Path "$winwsSrc\*" -Destination $dpiDir -Recurse -Force;
              Remove-Item -Path $bundleDir -Recurse -Force;
          }

          Remove-Item -Path $repoDir -Recurse -Force;

          Write-Host "Файлы в папке publish\dpi:";
          Get-ChildItem -Path $dpiDir | ForEach-Object { Write-Host (" - " + $_.Name + " (" + $_.Length + " bytes)") };

          $issPath = Join-Path $PWD "installer.iss";
          if (Test-Path $issPath) {
              $issContent = [System.IO.File]::ReadAllText($issPath);
              if (-not $issContent.Contains("publish\dpi")) {
                  Write-Host "Добавляем упаковку папки dpi в installer.iss...";
                  $dpiLine = 'Source: "publish\dpi\*"; DestDir: "{app}\dpi"; Flags: ignoreversion recursesubdirs createallsubdirs';
                  $issContent = $issContent.Replace("[Files]", "[Files]`r`n" + $dpiLine);
                  [System.IO.File]::WriteAllText($issPath, $issContent, [System.Text.Encoding]::UTF8);
              }
          }

      - name: Compile Windows Installer (Inno Setup)
        working-directory: ./windows
        run: iscc installer.iss

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Windows-Installer
          path: windows/installer_out/DNS_Switcher_Pro_Setup.exe
