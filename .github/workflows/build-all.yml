name: Build Android APK & Windows Installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Поток 1: Сборка Android-версии (.apk)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  # Поток 2: Сборка Windows-установщика (DNS_Switcher_Pro_Setup.exe)
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Custom Icon from File
        working-directory: ./windows
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $sourceFile =$null
          if (Test-Path "1000258844.ico") { $sourceFile = "1000258844.ico" }
          elseif (Test-Path "icon.ico") { $sourceFile = "icon.ico" }
          elseif (Test-Path "../1000258844.ico") { $sourceFile = "../1000258844.ico" }
          elseif (Test-Path "../icon.ico") { $sourceFile = "../icon.ico" }

          if ($sourceFile -ne$null) {
            Write-Host "Используется пользовательский файл иконки: $sourceFile"
            $origImg = [System.Drawing.Image]::FromFile((Resolve-Path $sourceFile).Path)$bmp = New-Object System.Drawing.Bitmap($origImg, 256, 256)$origImg.Dispose()

            $msPng = New-Object System.IO.MemoryStream
            $bmp.Save($msPng, [System.Drawing.Imaging.ImageFormat]::Png)$pngBytes = $msPng.ToArray()$bmp.Dispose()

            $fs = [System.IO.File]::Create("$PWD\icon.ico")
            $bw = New-Object System.IO.BinaryWriter($fs)
            $bw.Write([uint16]0);$bw.Write([uint16]1); $bw.Write([uint16]1)$bw.Write([byte]0); $bw.Write([byte]0);$bw.Write([byte]0); $bw.Write([byte]0)$bw.Write([uint16]1); $bw.Write([uint16]32)$bw.Write([uint32]$pngBytes.Length)$bw.Write([uint32]22)
            $bw.Write($pngBytes)
            $bw.Close()$fs.Close()
          } else {
            Write-Error "Файл icon.ico или 1000258844.ico не найден в папке windows/!"
            exit 1
          }

      - name: Publish Standalone EXE
        working-directory: ./windows
        run: dotnet publish DnsSwitcherPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

      - name: Compile Windows Installer (Inno Setup)
        working-directory: ./windows
        run: iscc installer.iss

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Switcher-Pro-Windows-Installer
          path: windows/installer_out/DNS_Switcher_Pro_Setup.exe
